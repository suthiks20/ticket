# Load balance seller HTTP requests without retrying failed POST requests.
events {}

http {
    upstream ticket_sellers {
        least_conn;
        server seller-1:3000;
        server seller-2:3000;
        server seller-3:3000;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://ticket_sellers;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_next_upstream off;
        }
    }
}
