services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ticket
      POSTGRES_PASSWORD: ticket
      POSTGRES_DB: tickets
    command: ["postgres", "-c", "max_connections=200", "-c", "idle_in_transaction_session_timeout=5000"]
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticket -d tickets"]
      interval: 3s
      timeout: 3s
      retries: 10

  toxiproxy:
    image: shopify/toxiproxy
    ports:
      - "8474:8474"
      - "5433:5433"

  seller-1:
    build: ./seller
    environment:
      DATABASE_URL: postgres://ticket:ticket@postgres:5432/tickets
      PORT: 3000
      SELLER_MODE: ${SELLER_MODE:-naive}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3001:3000"
    volumes:
      - ./schema.sql:/app/schema.sql:ro

  seller-2:
    build: ./seller
    environment:
      DATABASE_URL: postgres://ticket:ticket@postgres:5432/tickets
      PORT: 3000
      SELLER_MODE: ${SELLER_MODE:-naive}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3002:3000"
    volumes:
      - ./schema.sql:/app/schema.sql:ro

  seller-3:
    build: ./seller
    environment:
      DATABASE_URL: postgres://ticket:ticket@postgres:5432/tickets
      PORT: 3000
      SELLER_MODE: ${SELLER_MODE:-naive}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3003:3000"
    volumes:
      - ./schema.sql:/app/schema.sql:ro

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - seller-1
      - seller-2
      - seller-3

volumes:
  pgdata:
